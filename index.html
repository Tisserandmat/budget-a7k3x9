<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#0e1014">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:;">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>Budget</title>
<script>
try {
  var brut = JSON.parse(localStorage.getItem('budget-v2') || '{}');
  var theme = brut.theme;
  var clair = theme === 'clair' || (theme !== 'sombre' && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', clair ? 'clair' : 'sombre');
  var meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', clair ? '#f3f5f8' : '#0e1014');
} catch (e) {
  document.documentElement.setAttribute('data-theme', 'sombre');
}
</script>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <small id="bonjour">Bonjour</small>
        <h1 id="titre">Budget</h1>
      </div>
      <div class="top-actions">
        <button type="button" class="iconbtn" id="theme" aria-label="Changer le thème"></button>
        <button type="button" class="avatar" id="reglages" aria-label="Réglages">•</button>
      </div>
    </div>
  </header>
  <main>
    <section id="s-accueil" class="on"></section>
    <section id="s-planning"></section>
    <section id="s-budget"></section>
    <section id="s-objectifs"></section>
  </main>
  <nav id="nav">
    <button type="button" data-tab="accueil" class="on" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.5V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.5z"/></svg>
      Accueil
    </button>
    <button type="button" data-tab="planning" aria-label="Planning">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Planning
    </button>
    <button type="button" data-tab="budget" aria-label="Budget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10.5h19"/></svg>
      Budget
    </button>
    <button type="button" data-tab="objectifs" aria-label="Objectifs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
      Objectifs
    </button>
  </nav>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="fichier-profil" accept="application/json,.json" hidden>
<input type="file" id="fichier-releve" accept=".csv,text/csv,.pdf,application/pdf" hidden>
<input type="file" id="fichier-sauvegarde" accept="application/json,.json" hidden>
<script src="periode.js"></script>
<script src="calc.js"></script>
<script src="classement.js"></script>
<script src="csv.js"></script>
<script src="modele.js"></script>
<script src="app.js"></script>
</body>
</html>
