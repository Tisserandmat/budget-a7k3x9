header{padding:8px 16px;gap:8px;align-items:center;min-height:56px;background:var(--bg)}

#hsub{display:block;font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mon{background:var(--card);border-radius:18px;box-shadow:var(--sh);flex:none;height:36px;gap:0}

/* surfaces */
.card{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--sh);margin:0 0 12px}

<script>
"use strict";
const KEY='budget-app-v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100;
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=x=>nf.format(r2(x)).replace(/[\u202f\u00a0]/g,'\u00a0')+'\u00a0€';
const eur0=x=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(x)).replace(/[\u202f\u00a0]/g,'\u00a0')+'\u00a0€';
const pnum=s=>{const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v};
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mLabel=k=>{const[y,m]=k.split('-');return MONTHS[m-1]+' '+y};
const mShift=(k,n)=>{const[y,m]=k.split('-').map(Number);return mk(new Date(y,m-1+n,1))};
const mDiff=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=iso=>{const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y};

const SCHEMA=6;
const SD=()=>Math.min(28,Math.max(1,Math.round(+((S&&S.settings&&S.settings.startDay)||1))));
const MAB=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MABC=['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
const pKey=iso=>{const[y,m,d]=iso.split('-').map(Number);return +d>=SD()?iso.slice(0,7):mk(new Date(y,m-2,1))};
const inP=(iso,k)=>!!iso&&pKey(iso)===k;
const pStart=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,SD())};
const pEnd=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,SD()-1)};
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pLabel=k=>{const[y,m]=k.split('-').map(Number),a=pStart(k),b=pEnd(k);return MABC[m-1]+' '+y+(SD()===1?'':' ('+a.getDate()+' '+MAB[a.getMonth()]+' – '+b.getDate()+' '+MAB[b.getMonth()]+')')};
const PALETTE=['#0a84ff','#af52de','#ff2d92','#30b0c7','#ff9f0a','#34c759','#5e5ce6','#a2845e','#ff453a','#64d2ff'];
const ENV_DEF={nec:'#0a84ff',pro:'#af52de',pla:'#ff2d92'};
const freeColor=envs=>{const used=new Set(envs.map(e=>(e.color||'').toLowerCase()));return PALETTE.find(c=>!used.has(c))||PALETTE[envs.length%PALETTE.length]};

    if(!Array.isArray(s.vaultMoves))s.vaultMoves=[];s.v=6}

  const ic=st.importCfg,di=d.settings.importCfg;for(const k in di)if(!Array.isArray(ic[k]))ic[k]=di[k];
  if(!Array.isArray(s.vaults))s.vaults=[];if(!Array.isArray(s.vaultMoves))s.vaultMoves=[];s.vaults.forEach((v,i)=>{if(!v.id)v.id=uid();if(!v.color)v.color=VCOL[i%VCOL.length];if(v.n26==null)v.n26=v.name});
  return s}

  let rest=pool;const btc=ps.find(p=>p.kind==='btc');
  if(t&&t.phase===1){const v=Math.min(rest*.8,t.first-t.bal);out[t.p.id]+=v;rest-=v;why.push('Priorité : '+t.p.name+' jusqu\'à '+eur0(t.first)+(btc?' ('+btc.name+' bloqué).':'.'))}

  const grid=[.33,.66].map(f=>`<line x1="0" x2="${W}" y1="${(H-6-f*(H-16)).toFixed(1)}" y2="${(H-6-f*(H-16)).toFixed(1)}" stroke="var(--grid)"/>`).join('')+`<line x1="0" x2="${W}" y1="${H-6}" y2="${H-6}" stroke="var(--grid)"/>`;
  let s=`<svg class="ch" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses cumulées : ${esc(eur(ti>=0?cum[ti]:0))} sur ${esc(eur(plan))}">

  if(plan>0){const yb=Y(plan);s+=`<line x1="0" x2="${W}" y1="${yb.toFixed(1)}" y2="${yb.toFixed(1)}" stroke="var(--t3)" stroke-dasharray="3 4"/><text x="${W-2}" y="${(yb-5).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--sub)">Budget ${esc(eur0(plan))}</text>

  if(ti>=0){const[tx,ty]=[X(ti),Y(cum[ti])],lbl=esc(eur(cum[ti])),tw=lbl.length*6.6+16,left=tx+10+tw>W;
    s+=`<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" y2="${H-6}" stroke="var(--acc)" stroke-opacity=".4"/><circle class="pt" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5" fill="var(--card)" stroke="var(--acc)" stroke-width="2.25"/>

  const el=$('#reste'),prev=rHome.last;rHome.last=c.reste;if($('#v-home').classList.contains('anim')&&rHome.k!==cur)countUp(el,0,c.reste);else if(prev!=null&&prev!==c.reste)countUp(el,prev,c.reste);rHome.k=cur;
  const rc=recentCats(),q=[...rc,...allCats().map(x=>x.id).filter(id=>!rc.includes(id))].slice(0,2);
  $('#peek').innerHTML=q.map(id=>`<button class="qc" data-qcat="${id}">${catIc(id)}<span>${esc(catName(id).split(/\s*\/\s*/)[0])}</span></button>`).join('')+`<button class="add" data-act="qadd">${SV('plus')}Ajouter</button>`}
/* ---------- export / import ---------- */
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){download('budget-app-'+todayISO()+'.json',JSON.stringify({app:'budget-app',exported:new Date().toISOString(),data:S},null,1),'application/json');toast('Sauvegarde exportée')}
function exportCSV(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const cats=allCats();
  const rows=[['Date','Montant','Catégorie','Enveloppe','Note'].join(';')].concat([...S.expenses].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>{const c=cats.find(c=>c.id===x.cat)||{name:'Autre',env:''};return[x.date,nf.format(x.amount).replace(/\s/g,''),q(c.name),q(c.env),q(x.note||'')].join(';')}));
  download('depenses-app-'+todayISO()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');toast('CSV exporté')}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const d=o.data||o;if(!d.settings||!Array.isArray(d.expenses))throw 0;
  if(!confirm('Remplacer toutes les données par cette sauvegarde ?'))return;S=migrate(d);save();render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};r.readAsText(file)}

/* ---------- événements ---------- */
function setPath(path,val){const p=path.split('.');let o=S.settings;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-edit],[data-inc],[data-tr],[data-goto],[data-rled],[data-vault],[data-vmv],[data-envf]');if(!t)return;const d=t.dataset;
  if(d.tab){tab=d.tab;render();scrollTo(0,0);return}
  if(d.key&&F){if(d.key==='⌫')F.amt=F.amt.slice(0,-1);else if(d.key===','){if(!F.amt.includes(','))F.amt=(F.amt||'0')+','}else{const dec=F.amt.split(',')[1];if((dec==null||dec.length<2)&&F.amt.replace(',','').length<7)F.amt=(F.amt==='0'?'':F.amt)+d.key}updAmt();return}
  if(d.cat&&F){F.cat=d.cat;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===d.cat));updAmt();if(pnum(F.amt)>0&&!F.id)saveExp();return}
  if(d.thm){S.settings.theme=d.thm;save();render();toast(d.thm==='auto'?'Thème automatique':d.thm==='dark'?'Thème sombre':'Thème clair');return}
  if(d.qcat){expSheet();F.cat=d.qcat;document.querySelectorAll('#sheet .chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===d.qcat));updAmt();return}
  if(d.envf){homeF=homeF===d.envf?null:d.envf;rHome();return}
  if(d.vault)return vaultSheet(d.vault);
  if(d.vmv)return vMoveSheet(null,null,d.vmv);
  if(d.vm){const[id,dir]=d.vm.split('|');return vMoveSheet(id,dir)}
  if(d.vfix)return vFixSheet(d.vfix);
  if(d.ved)return vEditSheet(d.ved);
  if(d.dir&&F&&F.kind==='vmove'){F.dir=d.dir;document.querySelectorAll('#fDir button').forEach(b=>b.classList.toggle('on',b.dataset.dir===d.dir));return}
  if(d.vcol&&F&&F.kind==='vedit'){F.color=d.vcol;document.querySelectorAll('[data-vcol]').forEach(b=>b.classList.toggle('on',b.dataset.vcol===d.vcol));return}
  if(d.edit)return expSheet(d.edit);
  if(d.inc)return formSheet('inc',d.inc);
  if(d.tr)return formSheet('tr',d.tr);
  if(d.goto){cur=d.goto;render();scrollTo(0,0);return}
  if(d.paid){const m=M(cur);m.paid[d.paid]=!m.paid[d.paid];save();render();return}
  if(d.bdfall){const b=M(cur).bdf,v=!(b.lex&&b.cm);b.lex=b.cm=v;save();render();return}
  if(d.bdf){const b=M(cur).bdf;b[d.bdf]=!b[d.bdf];save();render();return}
  if(d.sh){const m=M(cur);m.shifts[d.sh]=Math.max(0,(m.shifts[d.sh]||0)+(+d.d));save();render();return}
  if(d.add)return addItem(d.add);
  if(d.mv){const[p,i,dd]=d.mv.split('|');return moveItem(p,+i,+dd)}
  if(d.rm){const[p,i]=d.rm.split('|');return removeItem(p,+i)}
  if(F&&F.kind==='ops'){
    if(d.ion!=null){const o=F.ops[+d.ion];if(o.ign&&!o.reinc){o.reinc=true;const[a,w]=classify(o,null);o.act=a;o.why=w;o.on=true}else o.on=!o.on;renderOps();return}
    if(d.ipick!=null)return openPick(+d.ipick);
    if(d.pk)return applyPick(JSON.parse(d.pk));
    if(d.iper){const s=F.sel;if(s.has(d.iper)){if(s.size>1)s.delete(d.iper)}else s.add(d.iper);renderOps();return}
    if(d.igrp){F.open[d.igrp]=!F.open[d.igrp];renderOps();return}}
  if(d.rlon!=null){const r=IC().rules[+d.rlon];r.on=r.on===false;save();render();return}
  if(d.rlrm!=null){const r=IC().rules[+d.rlrm];if(confirm('Supprimer la règle « '+ruleDesc(r).m+' » ?')){IC().rules.splice(+d.rlrm,1);save();render()}return}
  if(d.rled!=null)return ruleSheet(+d.rled);
  if(d.lrrm!=null){IC().learned.splice(+d.lrrm,1);save();render();toast('Règle supprimée');return}
  if(d.sw){const[ei,c]=d.sw.split('|');S.settings.envelopes[+ei].color=c;save();render();return}
  if(d.alt){const s=S.settings.shifts.find(x=>x.id===d.alt);s.useAlt=!s.useAlt;save();render();return}
  switch(d.act){case'close':closeSheet();break;case'saveexp':saveExp();break;
   case'delexp':if(confirm('Supprimer cette dépense ?')){S.expenses=S.expenses.filter(x=>x.id!==F.id);save();closeSheet();render();toast('Supprimée')}break;
   case'saveform':saveForm();break;
   case'delform':if(confirm('Supprimer ?')){if(F.kind==='inc')S.incomes=S.incomes.filter(x=>x.id!==F.id);else S.transfers=S.transfers.filter(x=>x.id!==F.id);save();closeSheet();render()}break;
   case'addinc':formSheet('inc');break;case'addtr':formSheet('tr');break;
   case'doreassign':doReassign();break;case'importops':$('#opsIn').click();pdfLib().catch(()=>{});break;case'closepick':closePick();break;case'addrule':ruleSheet(-1);break;case'saverule':saveRule();break;
   case'delrule':if(confirm('Supprimer cette règle ?')){IC().rules.splice(F.i,1);save();closeSheet();render()}break;case'undoimp':undoImport();break;
   case'rulesreset':if(confirm('Rétablir les règles intégrées par défaut ? (les règles apprises sont conservées)')){IC().rules=IMPORT_RULES();save();render();toast('Règles rétablies')}break;case'doimportops':doImportOps();break;
   case'json':exportJSON();break;case'csv':exportCSV();break;case'import':$('#fileIn').click();break;
   case'qadd':{expSheet();const r0=recentCats()[0];if(r0&&allCats().some(c=>c.id===r0)){F.cat=r0;document.querySelectorAll('#sheet .chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===r0));updAmt()}break}
   case'lpdup':lpDup();break;
   case'lpedit':{const i=F.id;closeSheet();expSheet(i);break}
   case'rsdata':resetSheet('data');break;case'rsset':resetSheet('set');break;case'rsall':resetSheet('all');break;case'rsgo':doReset();break;
   case'rulesexp':exportRules();break;case'rulesimp':$('#rulesIn').click();break;
   case'vnew':vEditSheet(null);break;case'vsave':saveVault();break;case'vmove':vMoveSheet(F&&F.kind==='vault'?F.id:null,'+');break;case'vmsave':saveVMove();break;
   case'vmdel':if(confirm('Supprimer ce mouvement ?')){const b=F.back;S.vaultMoves=S.vaultMoves.filter(x=>x.id!==F.id);save();closeSheet();render();vaultSheet(b);toast('Supprimé')}break;
   case'vfsave':{const a=pAmt($('#fAmt').value);if(a==null)return toast('Solde ?');const v=V(F.id);v.anchor={date:$('#fDate').value||todayISO(),amount:r2(a)};save();closeSheet();render();vaultSheet(v.id);toast('Solde fixé');break}
   case'vfclear':{const v=V(F.id);v.anchor=null;save();closeSheet();render();vaultSheet(v.id);break}
   case'vdel':{const v=V(F.id),n=S.vaultMoves.filter(x=>x.vault===v.id).length;if(confirm(`Supprimer le coffre « ${v.name} »`+(n?` et ses ${n} mouvement(s)`:'')+' ?')){S.vaults=S.vaults.filter(x=>x.id!==v.id);S.vaultMoves=S.vaultMoves.filter(x=>x.vault!==v.id);save();closeSheet();render();toast('Coffre supprimé')}break}}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.set==='startDay'){S.settings.startDay=Math.min(28,Math.max(1,Math.round(pnum(t.value))||1));cur=pKey(todayISO());save();render()}
  else if(d.set){setPath(d.set,r2(pnum(t.value)));save();render()}
  else if(d.setn){setPath(d.setn,t.value.trim());save();render()}
  else if(d.ownnames){IC().ownNames=t.value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);save();toast('Enregistré')}
  else if(d.lrcat!=null){IC().learned[+d.lrcat].act={k:'cat',cat:t.value};save();toast('Règle modifiée')}
  else if(t.id==='pkLearn'&&F){F.learn=t.checked}
  else if(t.id==='vRecon'&&F&&F.kind==='ops'){F.recon=t.checked;renderOps()}
  else if(d.envcolor!=null){S.settings.envelopes[+d.envcolor].color=t.value;save();render()}
  else if(d.mvenv){const[ei,ci]=d.mvenv.split('|').map(Number);moveCatEnv(ei,ci,+t.value)}
  else if(d.bdfamt){M(cur).bdf[d.bdfamt]=r2(pnum(t.value));save();render()}});
$('#opsIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importOpsFile(f);e.target.value=''});
$('#rulesIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importRules(f);e.target.value=''});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value=''});
$('#sbg').onclick=closeSheet;$('#pbg').onclick=closePick;$('#fab').onclick=()=>expSheet();
$('#gear').onclick=()=>{tab='set';render();scrollTo(0,0)};
$('#mPrev').onclick=()=>{cur=mShift(cur,-1);render()};$('#mNext').onclick=()=>{cur=mShift(cur,1);render()};
load();cur=pKey(todayISO());render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
