<style>
:root{--bg:#f2f2f7;--card:#fff;--txt:#000;--sub:#8e8e93;--sep:rgba(60,60,67,.18);--acc:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--fill:rgba(120,120,128,.14);--bar:rgba(249,249,249,.88);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--txt:#fff;--sub:#8e8e93;--sep:rgba(84,84,88,.6);--acc:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.28);--bar:rgba(22,22,24,.88)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.5px}
.mon{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:12px}
.mon button{width:40px;height:40px;border:0;background:none;color:var(--acc);font-size:22px}
.mon span{font-size:15px;font-weight:600;min-width:104px;text-align:center}
.gear{width:44px;height:44px;border:0;background:none;color:var(--acc);font-size:24px}
main{padding:4px 16px calc(150px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.sec{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;margin:18px 4px 6px}
.big{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--sub)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:0}
.row .r{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid2 .card{margin:0}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--orange)}.sub{color:var(--sub);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.rings{display:flex;justify-content:space-around;text-align:center}
.ring{width:84px}.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{display:block;font-size:13px;margin-top:4px}.ring small{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--sub)}
.badge.red{background:rgba(255,59,48,.15);color:var(--red)}.badge.or{background:rgba(255,149,0,.15);color:var(--orange)}.badge.gr{background:rgba(52,199,89,.15);color:var(--green)}
.alert{padding:10px 14px;border-radius:12px;margin:0 0 10px;font-size:15px;background:rgba(255,149,0,.13)}
.alert.red{background:rgba(255,59,48,.13)}
button.btn{min-height:48px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;font-weight:600;padding:0 18px;width:100%}
button.btn.sec2{background:var(--fill);color:var(--acc)}button.btn.del{background:var(--fill);color:var(--red)}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr}
input,select{font:inherit;color:var(--txt);background:var(--fill);border:0;border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input.num{width:110px;text-align:right}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--sub);display:inline-flex;align-items:center;justify-content:center;flex:none;background:none;color:#fff;font-size:16px;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.exp{cursor:pointer}.exp .t{flex:1;min-width:0}.exp .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill);color:var(--acc);font-size:22px}.step b{min-width:24px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:10.5px;padding:6px 0 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:26px;height:26px}nav button.on{color:var(--acc)}
.fab{position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;width:62px;height:62px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:36px;font-weight:300;box-shadow:0 6px 20px rgba(0,122,255,.4);line-height:1}
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:none}.sheetbg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:94vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 8px}
.amt{font-size:46px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border:0;border-radius:18px;padding:0 14px;min-height:38px;background:var(--card);color:var(--txt);font-size:15px}
.chip{box-shadow:inset 3px 0 0 var(--c,var(--acc))}.chip.on{background:var(--c,var(--acc));color:#fff;box-shadow:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.st{display:block;font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}.st.or{color:var(--orange)}.st.red{color:var(--red)}
.ovf{background:repeating-linear-gradient(45deg,var(--red) 0 4px,transparent 4px 7px);border-radius:0 3px 3px 0}
input.clr{width:40px;height:40px;min-height:40px;padding:3px;border-radius:50%;flex:none;cursor:pointer}input.clr::-webkit-color-swatch-wrapper{padding:0}input.clr::-webkit-color-swatch{border:0;border-radius:50%}
.swatches{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 4px}.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}.sw.on{border-color:var(--txt)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.keys button{height:52px;border:0;border-radius:12px;background:var(--card);color:var(--txt);font-size:26px}
.sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
h3{margin:0 0 6px;font-size:17px}
.erow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:.5px solid var(--sep);flex-wrap:nowrap}.erow.wrap{flex-wrap:wrap}
.erow input.nm{flex:1;min-width:0;width:auto}.erow input.num{width:96px}.erow2{display:flex;align-items:center;gap:6px;width:100%}.erow2 select{flex:1;min-width:0;width:auto;min-height:40px;font-size:15px}
.ctl{display:flex;gap:4px;flex:none}.ctl button{width:36px;height:40px;border:0;border-radius:9px;background:var(--fill);color:var(--acc);font-size:17px}.ctl button.x{color:var(--red)}.ctl button:disabled{opacity:.3}
.addb{border:0;background:none;color:var(--acc);font-size:16px;min-height:44px;padding:0;width:100%;text-align:left}
.rings{flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<header><h1 id="title">Budget</h1><div class="mon"><button id="mPrev" aria-label="Mois précédent">‹</button><span id="mLbl"></span><button id="mNext" aria-label="Mois suivant">›</button></div><button class="gear" id="gear" aria-label="Réglages">⚙︎</button></header>
<main>
<section class="view" id="v-home"></section>
<section class="view" id="v-exp"></section>
<section class="view" id="v-inc"></section>
<section class="view" id="v-debt"></section>
<section class="view" id="v-sav"></section>

</main>
<button class="fab" id="fab" aria-label="Ajouter une dépense">+</button>

<div class="sheetbg" id="sbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="opsIn" accept=".csv,.json,text/csv,application/json" hidden>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script>
"use strict";
const KEY='budget-app-v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100;
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=x=>nf.format(r2(x)).replace(/[\u202f\u00a0]/g,'\u00a0')+'\u00a0€';
const eur0=x=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(x)).replace(/[\u202f\u00a0]/g,'\u00a0')+'\u00a0€';
const pnum=s=>{const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v};
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mLabel=k=>{const[y,m]=k.split('-');return MONTHS[m-1]+' '+y};
const mShift=(k,n)=>{const[y,m]=k.split('-').map(Number);return mk(new Date(y,m-1+n,1))};
const mDiff=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=iso=>{const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y};

const SCHEMA=4;
const SD=()=>Math.min(28,Math.max(1,Math.round(+((S&&S.settings&&S.settings.startDay)||1))));
const MAB=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MABC=['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
const pKey=iso=>{const[y,m,d]=iso.split('-').map(Number);return +d>=SD()?iso.slice(0,7):mk(new Date(y,m-2,1))};
const inP=(iso,k)=>!!iso&&pKey(iso)===k;
const pStart=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,SD())};
const pEnd=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,SD()-1)};
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pLabel=k=>{const[y,m]=k.split('-').map(Number),a=pStart(k),b=pEnd(k);return MABC[m-1]+' '+y+(SD()===1?'':' ('+a.getDate()+' '+MAB[a.getMonth()]+' – '+b.getDate()+' '+MAB[b.getMonth()]+')')};
const PALETTE=['#0a84ff','#af52de','#ff2d92','#30b0c7','#ff9f0a','#34c759','#5e5ce6','#a2845e','#ff453a','#64d2ff'];
const ENV_DEF={nec:'#0a84ff',pro:'#af52de',pla:'#ff2d92'};
const freeColor=envs=>{const used=new Set(envs.map(e=>(e.color||'').toLowerCase()));return PALETTE.find(c=>!used.has(c))||PALETTE[envs.length%PALETTE.length]};
function defaults(){
  const c=(id,name,amount)=>({id,name,amount});
  return {v:SCHEMA,
   settings:{startDay:1,base:0,low:0,
    fixed:[c('loyer','Loyer',0),c('assur','Assurance auto',0),c('tel','Téléphone',0),c('abo','Abonnements',0)],
    envelopes:[
     {id:'nec',name:'Nécessaire',color:'#0a84ff',cats:[c('courses','Courses',0),c('carbu','Carburant',0),c('voiture','Voiture',0),c('sante','Santé / Barber',0),c('divers','Divers',0)]},
     {id:'pro',name:'Proches',color:'#af52de',cats:[c('p1','Proche 1',0),c('p2','Proche 2',0),c('p3','Proche 3',0)]},
     {id:'pla',name:'Plaisirs',color:'#ff2d92',cats:[c('sorties','Sorties / Dates',0),c('restos','Restaurants',0),c('tabac','Tabac / Vape',0),c('amazon','Amazon / Divers',0),c('shopping','Shopping / Vêtements',0)]}],
    shifts:[{id:'mw',name:'Matin / aprem semaine',rate:0},{id:'nw',name:'Nuit semaine',rate:0},{id:'sm',name:'Samedi matin',rate:0},{id:'sa',name:'Samedi aprem',rate:0,alt:0,useAlt:false},{id:'sn',name:'Samedi nuit',rate:0}],
    incomeTypes:[{id:'salaire',name:'Salaire'},{id:'acompte',name:'Acompte'},{id:'prime',name:'Prime'},{id:'autre',name:'Autre'}],
    bdf:{start:'2026-01',n:12,total:0,lex:0,cm:0},
    pockets:[{id:'ef',kind:'ef',name:"Fonds d'urgence",first:0,months:3,where:'LEP / Livret A',init:0},{id:'voiture',kind:'std',name:'Voiture',target:0,init:0},{id:'voyage',kind:'std',name:'Voyage',target:0,init:0},{id:'btc',kind:'btc',name:'Bitcoin',min:0,max:0,init:0}]},
   months:{}, expenses:[], incomes:[], transfers:[]};
}
function seed(s){return s;}
/* Migration de schéma : conserve toutes les données existantes */
function migrate(s){const d=defaults(),st=s.settings;
  if(!s.v||s.v<2){
    if(st.goals&&!st.pockets){const g=st.goals;st.pockets=[{...d.settings.pockets[0],...g.ef,id:'ef',kind:'ef'},{id:'voiture',kind:'std',...g.voiture},{id:'voyage',kind:'std',...g.voyage},{id:'btc',kind:'btc',...g.btc}]}
    delete st.goals;
    if(!st.envelopes.some(e=>e.cats.some(c=>c.id==='shopping'))){const pla=st.envelopes.find(e=>e.id==='pla')||st.envelopes[st.envelopes.length-1];pla.cats.push({id:'shopping',name:'Shopping / Vêtements',amount:50})}
    (s.expenses||[]).forEach(x=>{if(x.cat==='amazon'&&/v[êe]tement|shopping/i.test(x.note||''))x.cat='shopping'});
    const sa=(st.shifts||[]).find(x=>x.id==='sa');if(sa)sa.useAlt=!!st.sat100;delete st.sat100;
    if(!st.incomeTypes)st.incomeTypes=d.settings.incomeTypes;
    (s.incomes||[]).forEach(x=>{if(!x.type)x.type=/acompte/i.test(x.label||'')?'acompte':'salaire'});
    s.v=2;}
  if(s.v<3){st.envelopes.forEach(e=>{if(!e.color)e.color=ENV_DEF[e.id]&&!st.envelopes.some(x=>x.color===ENV_DEF[e.id])?ENV_DEF[e.id]:freeColor(st.envelopes)});s.v=3}
  if(s.v<4){if(st.startDay==null)st.startDay=d.settings.startDay;s.v=4}
  for(const k in d)if(s[k]==null)s[k]=d[k];for(const k in d.settings)if(st[k]==null)st[k]=d.settings[k];
  return s}
let S;
function load(){let txt=null,raw=null;try{txt=localStorage.getItem(KEY);raw=JSON.parse(txt)}catch(e){}
  if(raw&&raw.settings){const old=raw.v||1;S=migrate(raw);if(old<SCHEMA){try{localStorage.setItem(KEY+'-backup-v'+old,txt)}catch(e){}}}
  else S=seed(defaults());save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Stockage impossible')}}
let cur,tab='home';
const M=k=>{S.months[k]=S.months[k]||{paid:{},bdf:{},shifts:{}};const m=S.months[k];m.paid=m.paid||{};m.bdf=m.bdf||{};m.shifts=m.shifts||{};return m};
const allCats=()=>S.settings.envelopes.flatMap(e=>e.cats.map(c=>({...c,env:e.name,envId:e.id})));
const catName=id=>(allCats().find(c=>c.id===id)||{name:'Autre'}).name;
const sRate=s=>s.useAlt&&s.alt?s.alt:s.rate;
const itName=id=>(S.settings.incomeTypes.find(t=>t.id===id)||{name:'Revenu'}).name;

/* ---------- calculs ---------- */
function bdfMonth(k){const b=S.settings.bdf,i=mDiff(b.start,k);if(i<0||i>=b.n)return null;const m=M(k).bdf;
  const lexA=m.lexAmt!=null?m.lexAmt:b.lex,cmA=m.cmAmt!=null?m.cmAmt:b.cm;return{i:i+1,lexA,cmA,due:r2(lexA+cmA),paid:r2((m.lex?lexA:0)+(m.cm?cmA:0)),lex:!!m.lex,cm:!!m.cm}}
function bdfStats(){const b=S.settings.bdf;let paid=0,n=0;for(let i=0;i<b.n;i++){const x=bdfMonth(mShift(b.start,i));paid+=x.paid;if(x.lex&&x.cm)n++}
  paid=r2(paid);return{paid,rest:r2(Math.max(0,b.total-paid)),pct:Math.min(1,paid/b.total),full:n,end:mShift(b.start,b.n-1)}}
function calc(k){const st=S.settings,m=M(k);
  const income=r2(S.incomes.filter(x=>inP(x.date,k)).reduce((a,x)=>a+x.amount,0));
  const bd=bdfMonth(k);
  const fixed=st.fixed.map(f=>({...f,paid:!!m.paid[f.id]}));
  const fixedPlan=r2(fixed.reduce((a,f)=>a+f.amount,0)+(bd?bd.due:0));
  const fixedPaid=r2(fixed.reduce((a,f)=>a+(f.paid?f.amount:0),0)+(bd?bd.paid:0));
  const exps=S.expenses.filter(x=>inP(x.date,k));
  const byCat={};exps.forEach(x=>byCat[x.cat]=r2((byCat[x.cat]||0)+x.amount));
  const spent=r2(exps.reduce((a,x)=>a+x.amount,0));
  const envs=st.envelopes.map(e=>{const plan=r2(e.cats.reduce((a,c)=>a+c.amount,0)),real=r2(e.cats.reduce((a,c)=>a+(byCat[c.id]||0),0));return{...e,plan,real}});
  const envPlan=r2(envs.reduce((a,e)=>a+e.plan,0));
  const tr=r2(S.transfers.filter(x=>inP(x.date,k)).reduce((a,x)=>a+x.amount,0));
  const reste=r2(income-fixedPlan-spent-tr);
  const now=pKey(todayISO());let days;const DAY=864e5,t0=new Date();t0.setHours(0,0,0,0);
  if(k===now){days=Math.round((pEnd(k)-t0)/DAY)+1}else if(k>now){days=Math.round((pEnd(k)-pStart(k))/DAY)+1}else days=0;
  const envLeft=r2(envs.reduce((a,e)=>a+Math.max(0,e.plan-e.real),0)+envs.reduce((a,e)=>a+e.cats.reduce((b,c)=>b+0,0),0));
  const savePlan=r2(Math.max(0,(income||0)-fixedPlan-envPlan));
  const surplus=r2(Math.max(0,income-st.base));
  const low=income>0&&income<st.low;
  return{income,bd,fixed,fixedPlan,fixedPaid,exps,byCat,spent,envs,envPlan,tr,reste,days,perDay:days?reste/days:null,savePlan,surplus,low,envLeft}}
const P=id=>S.settings.pockets.find(p=>p.id===id);
const pocketName=id=>(P(id)||{name:'Poche supprimée'}).name;
function goalBal(id){const p=P(id);return r2(((p&&p.init)||0)+S.transfers.filter(x=>x.goal===id).reduce((a,x)=>a+x.amount,0))}
function efTarget(){const ef=S.settings.pockets.find(p=>p.kind==='ef');if(!ef)return null;const c=calc(cur);const bal=goalBal(ef.id);
  return{p:ef,first:ef.first||0,full:r2((c.fixedPlan+c.envPlan)*(ef.months||3)),phase:bal<(ef.first||0)?1:2,bal}}
function alloc(k){const c=calc(k),ps=S.settings.pockets,t=efTarget(),out={},why=[];ps.forEach(p=>out[p.id]=0);const pool=c.savePlan;
  if(pool<=0)return{out,pool:0,why:['Pas d\'épargne disponible ce mois (revenu non saisi ou insuffisant).']};
  let rest=pool;const btc=ps.find(p=>p.kind==='btc');
  if(t&&t.phase===1){const v=Math.min(rest*.8,t.first-t.bal);out[t.p.id]+=v;rest-=v;why.push('Priorité : '+t.p.name+' jusqu\'à '+eur0(t.first)+(btc?' ('+btc.name+' bloqué).':'.'))}
  else{if(btc){if(c.low)why.push('Mois bas (< '+eur0(S.settings.low)+') : pas de '+btc.name+'.');else{const v=Math.min(rest,pool>=400?btc.max:pool>=150?Math.round((btc.min+btc.max)/2):btc.min);out[btc.id]+=v;rest-=v;why.push(btc.name+' autorisé (fonds ≥ palier, mois non bas).')}}
    if(t){const v=Math.min(Math.max(0,t.full-t.bal),rest*.5);out[t.p.id]+=v;rest-=v}}
  const std=ps.filter(p=>p.kind==='std'),need=std.map(p=>Math.max(0,(p.target||0)-goalBal(p.id)));
  for(let pass=0;pass<4&&rest>0.005;pass++){const act=std.map((p,i)=>need[i]>0.005?i:-1).filter(i=>i>=0);if(!act.length)break;const W=act.reduce((a,_,j)=>a+act.length-j,0);let used=0;
    act.forEach((i,j)=>{const v=Math.min(need[i],rest*(act.length-j)/W);out[std[i].id]+=v;need[i]-=v;used+=v});rest-=used}
  if(rest>0.005){const tg=t?t.p:std[0];if(tg)out[tg.id]+=rest}
  if(std.length>1)why.push('Poches réparties selon leur ordre de priorité.');
  for(const x in out)out[x]=r2(out[x]);return{out,pool,why}}

function ring(p,label,sub,color){const R=36,C=2*Math.PI*R,v=Math.min(1,p),o=p>1?Math.min(1,p-1):0;return`<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" fill="none" stroke="${color}" stroke-opacity=".2" stroke-width="9"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v)}"/>${o?`<circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--card)" stroke-width="11" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-o)}" opacity=".55"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-o)}"/><circle cx="${42+R}" cy="42" r="6" fill="var(--red)" stroke="var(--card)" stroke-width="2"/>`:''}</svg><b><i class="dot" style="background:${color}"></i>${esc(label)}</b><small>${sub}</small>${stat(p)}</div>`}

/* ---------- import d'opérations (JSON / CSV) ---------- */
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

function splitCSV(text){const sep=[';','\t',','].map(s=>[s,(text.split('\n')[0].match(new RegExp(s==='\t'?'\t':'\\'+s,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}

function pAmt(v){if(typeof v==='number')return v;let s=String(v||'').replace(/[\s\u00a0\u202f€]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isNaN(n)?null:n}
function toOps(raw){const ops=[],errors=[];raw.forEach((o,i)=>{const date=pDate(o.date),a=pAmt(o.amount);if(!date||a==null||a===0){errors.push(i+1);return}

function parseOps(name,text){text=text.replace(/^\ufeff/,'');let raw=[];

   case'delexp':if(confirm('Supprimer cette dépense ?')){S.expenses=S.expenses.filter(x=>x.id!==F.id);save();closeSheet();render();toast('Supprimée')}break;
   case'saveform':saveForm();break;
   case'delform':if(confirm('Supprimer ?')){if(F.kind==='inc')S.incomes=S.incomes.filter(x=>x.id!==F.id);else S.transfers=S.transfers.filter(x=>x.id!==F.id);save();closeSheet();render()}break;
   case'addinc':formSheet('inc');break;case'addtr':formSheet('tr');break;
   case'estinc':{const st=S.settings,m=M(cur);const est=r2(st.shifts.reduce((a,s)=>a+(m.shifts[s.id]||0)*sRate(s),0));formSheet('inc');$('#fAmt').value=nf.format(est).replace(/\s/g,'');$('#fNote').value='Estimation postes';break}
   case'doreassign':doReassign();break;case'importops':$('#opsIn').click();break;case'doimportops':doImportOps();break;
   case'json':exportJSON();break;case'csv':exportCSV();break;case'import':$('#fileIn').click();break;
   case'reset':if(confirm('Effacer toutes les données et revenir aux valeurs de départ ?')){S=seed(defaults());save();render();toast('Réinitialisé')}break;}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.set==='startDay'){S.settings.startDay=Math.min(28,Math.max(1,Math.round(pnum(t.value))||1));cur=pKey(todayISO());save();render()}
  else if(d.set){setPath(d.set,r2(pnum(t.value)));save();render()}
  else if(d.setn){setPath(d.setn,t.value.trim());save();render()}
  else if(d.opmap!=null&&F&&F.kind==='ops'){F.map[d.opmap]=t.value;const y=$('#sheet').scrollTop;renderOps();$('#sheet').scrollTop=y}
  else if(d.envcolor!=null){S.settings.envelopes[+d.envcolor].color=t.value;save();render()}
  else if(d.mvenv){const[ei,ci]=d.mvenv.split('|').map(Number);moveCatEnv(ei,ci,+t.value)}
  else if(d.bdfamt){M(cur).bdf[d.bdfamt]=r2(pnum(t.value));save();render()}});
$('#opsIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importOpsFile(f);e.target.value=''});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value=''});
$('#sbg').onclick=closeSheet;$('#fab').onclick=()=>expSheet();
$('#gear').onclick=()=>{tab='set';render();scrollTo(0,0)};
$('#mPrev').onclick=()=>{cur=mShift(cur,-1);render()};$('#mNext').onclick=()=>{cur=mShift(cur,1);render()};
load();cur=pKey(todayISO());render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body>
